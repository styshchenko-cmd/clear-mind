<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked · ClearMind</title>
<link rel="stylesheet" href="../styles/clearmind.css">
<script type="module" src="blocked.js"></script>
</head>
<body>
<div class="center-page">
<div class="column">

<div class="crumbs">
<div class="row g8"><span class="green">&gt;</span><span>clearmind</span><span>//</span><span class="red">blocked</span></div>
<span id="rule"></span>
</div>

<div class="stack g12">
<h1 class="big-title"><span id="domain"></span><span class="cursor red" aria-hidden="true"></span></h1>
<p id="reason" class="muted" style="margin: 0"></p>
</div>

<div id="message-box" class="quote" hidden>
<div class="label">your message</div>
<p id="message"></p>
</div>

<div class="grid-auto g12" style="--min: 180px; gap: 12px">
<div id="time-tile" class="stack g4 box" style="padding: 12px 16px">
<span class="label">time here today</span>
<span id="time" class="strong amber num"></span>
</div>
<div class="stack g4 box" style="padding: 12px 16px">
<span class="label">unlocks this week</span>
<span id="unlocks" class="strong num">0</span>
</div>
</div>

<details id="unlock-details" class="unlock">
<summary class="btn">[ still need it? ]</summary>
<form id="unlock-form" class="stack g10">
<label id="unlock-label" for="pw" style="font-size: 13px; line-height: 20px" class="muted"></label>
<div class="row wrap-row g10">
<input id="pw" type="password" class="input" placeholder="password" autocomplete="current-password" style="flex: 1 1 220px; width: auto; min-width: 0; font-size: 15px">
<button id="unlock" type="submit" class="btn btn-strong" style="flex: 0 0 auto; font-size: 15px"></button>
</div>
<p id="error" class="error" role="alert"></p>
</form>
</details>

<div class="row wrap-row between g12" style="font-size: 13px; line-height: 20px">
<a id="back" href="#">← back to where you were</a>
<a id="edit" href="#" class="muted">edit this rule</a>
</div>

</div>
</div>
</body>
</html>
